aid: accelus
name: Accelus
description: >-
  Accelus was a Palm Beach Gardens, Florida medical device company formed in 2021 by the
  combination of Integrity Implants and Fusion Robotics, built around an "Adaptive Geometry"
  expandable-implant platform for minimally invasive spine surgery. Its products were the
  FlareHawk and Toro expandable interbody fusion systems for transforaminal, posterior and
  lateral lumbar interbody fusion, the LineSider minimally invasive pedicle screw system, and
  the Remi Robotic Navigation System, a table-mounted intra-operative navigation and robotics
  platform that guided instrumentation from 2D fluoroscopic or 3D imaging. The company raised
  roughly $32M from investors including Concord Health Partners, Symbiotic Capital, Eastward
  Capital Partners and Trog Hawley Capital. It sold the Remi robotic navigation assets to
  Alphatec Holdings for $55M in April 2023 and its remaining implant products and intellectual
  property — FlareHawk, Toro and LineSider — to Highridge Medical on 2 September 2025. Accelus
  sold surgical hardware and single-use implants to hospitals and surgeons, never operated a
  developer program, and published no public API, SDK, webhook surface or machine-readable
  specification. Its only host, the WordPress marketing site accelusinc.com, is now a suspended
  cPanel hosting account that returns an "Account Suspended" page on every path behind a TLS
  certificate that expired on 2026-05-13, and no accelusinc.com subdomain resolves. This profile
  is retained as a historical record; there is no API surface to enrich.
